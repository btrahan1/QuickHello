<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickHello</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 24px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .settings-container {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .input-group.active {
            max-height: 300px;
            opacity: 1;
            margin-top: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            font-size: 0.875rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input[type="tel"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #currentNumberDisplay {
            margin-top: 16px;
            font-size: 0.875rem;
            color: var(--text-muted);
            padding: 12px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipient-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .recipient-details strong {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 8px;
        }

        .action-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .action-btn .icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .action-btn .label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Message highlights */
        #coffee:hover .icon { filter: drop-shadow(0 0 8px #d97706); }
        #wave:hover .icon { filter: drop-shadow(0 0 8px #3b82f6); }
        #heart:hover .icon { filter: drop-shadow(0 0 8px #ef4444); }
        #hungry:hover .icon { filter: drop-shadow(0 0 8px #f97316); }
        #dinner:hover .icon { filter: drop-shadow(0 0 8px #10b981); }
        #call:hover .icon { filter: drop-shadow(0 0 8px #34d399); }

        @media (max-width: 480px) {
            .glass-card {
                padding: 24px;
            }
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid var(--card-bg);
            cursor: pointer;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .action-btn:hover .delete-btn {
            opacity: 1;
        }

        .action-btn {
            position: relative;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-card">
        <h1>QuickHello</h1>

        <div class="actions-grid" id="actionsGrid">
            <!-- Dynamically populated -->
        </div>

        <div class="settings-container">
            <div id="currentNumberDisplay">No recipient configured.</div>

            <div class="btn-group">
                <button id="selectContactButton" class="btn btn-secondary">
                    <span>👤</span> Contact
                </button>
                <button id="toggleManualButton" class="btn btn-secondary">
                    <span>⌨️</span> Manual
                </button>
                <button id="toggleAddButton" class="btn btn-secondary">
                    <span>➕</span> Add
                </button>
            </div>

            <div class="input-group" id="manualEntryForm">
                <label for="phoneNumberInput">Enter Number</label>
                <input type="tel" id="phoneNumberInput" placeholder="+1234567890">
                <div class="btn-group">
                    <button id="saveManualButton" class="btn btn-primary">Save</button>
                    <button id="cancelManualButton" class="btn btn-secondary">Cancel</button>
                </div>
            </div>

            <div class="input-group" id="addButtonForm">
                <label>Add New Button</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newButtonIcon" placeholder="Icon (e.g. 🏡)" style="flex: 1; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white;">
                    <input type="text" id="newButtonLabel" placeholder="Label (e.g. Home)" style="flex: 2; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white;">
                </div>
                <textarea id="newButtonMessage" placeholder="Message to send..." style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; min-height: 80px; font-family: inherit; resize: none; box-sizing: border-box;"></textarea>
                <div class="btn-group">
                    <button id="saveNewButton" class="btn btn-primary">Add Button</button>
                    <button id="cancelAddButton" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_BUTTONS = [
            { id: 'coffee', icon: '☕', label: 'Coffee', message: 'Coffee! Now! ☕' },
            { id: 'wave', icon: '👋', label: 'Wave', message: '👋' },
            { id: 'heart', icon: '❤️', label: 'Heart', message: '❤️' },
            { id: 'hungry', icon: '🍕', label: 'Hungry', message: 'I\'m hungry! 🍕' },
            { id: 'dinner', icon: '🍽️', label: 'Dinner', message: 'Dinner is ready! 🍽️' },
            { id: 'call', icon: '📞', label: 'Call', isCall: true }
        ];

        let customButtons = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadConfiguredNumber();
            loadCustomButtons();
            renderButtons();
            
            document.getElementById('selectContactButton').addEventListener('click', selectContact);
            document.getElementById('saveManualButton').addEventListener('click', saveManualNumber);
            document.getElementById('toggleManualButton').addEventListener('click', () => toggleForm('manualEntryForm', true));
            document.getElementById('cancelManualButton').addEventListener('click', () => toggleForm('manualEntryForm', false));
            
            document.getElementById('toggleAddButton').addEventListener('click', () => toggleForm('addButtonForm', true));
            document.getElementById('cancelAddButton').addEventListener('click', () => toggleForm('addButtonForm', false));
            document.getElementById('saveNewButton').addEventListener('click', addNewButton);
        });

        function toggleForm(id, show) {
            const forms = ['manualEntryForm', 'addButtonForm'];
            forms.forEach(fId => {
                const form = document.getElementById(fId);
                if (fId === id && show) {
                    form.classList.add('active');
                } else {
                    form.classList.remove('active');
                }
            });
        }

        function loadCustomButtons() {
            const saved = localStorage.getItem('customButtons');
            if (saved) {
                customButtons = JSON.parse(saved);
            } else {
                customButtons = [...DEFAULT_BUTTONS];
                saveCustomButtons();
            }
        }

        function saveCustomButtons() {
            localStorage.setItem('customButtons', JSON.stringify(customButtons));
        }

        function renderButtons() {
            const grid = document.getElementById('actionsGrid');
            grid.innerHTML = '';
            
            customButtons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'action-btn';
                button.id = btn.id;
                button.innerHTML = `
                    <span class="icon">${btn.icon}</span>
                    <span class="label">${btn.label}</span>
                    ${!DEFAULT_BUTTONS.find(d => d.id === btn.id) ? `<span class="delete-btn" onclick="deleteButton(event, '${btn.id}')">×</span>` : ''}
                `;
                
                if (btn.isCall) {
                    button.onclick = () => callRecipient();
                } else {
                    button.onclick = () => sendMessage(btn.id);
                }
                
                grid.appendChild(button);
            });
        }

        function addNewButton() {
            const icon = document.getElementById('newButtonIcon').value.trim();
            const label = document.getElementById('newButtonLabel').value.trim();
            const message = document.getElementById('newButtonMessage').value.trim();

            if (!icon || !label || !message) {
                alert('Please fill in all fields (Icon, Label, and Message).');
                return;
            }

            const newBtn = {
                id: 'custom_' + Date.now(),
                icon: icon,
                label: label,
                message: message
            };

            customButtons.splice(customButtons.length - 1, 0, newBtn); // Add before "Call"
            saveCustomButtons();
            renderButtons();
            
            // Reset form
            document.getElementById('newButtonIcon').value = '';
            document.getElementById('newButtonLabel').value = '';
            document.getElementById('newButtonMessage').value = '';
            toggleForm('addButtonForm', false);
        }

        function deleteButton(event, id) {
            event.stopPropagation();
            if (confirm('Delete this button?')) {
                customButtons = customButtons.filter(b => b.id !== id);
                saveCustomButtons();
                renderButtons();
            }
        }

        function loadConfiguredNumber() {
            const savedNumber = localStorage.getItem('targetPhoneNumber');
            const savedName = localStorage.getItem('targetContactName');
            const savedIcon = localStorage.getItem('targetContactIcon');
            displayConfiguredNumber(savedNumber, savedName, savedIcon);
        }

        function displayConfiguredNumber(number, name, icon) {
            const displayElement = document.getElementById('currentNumberDisplay');
            if (number) {
                const displayName = name || 'User';
                const avatarContent = icon 
                    ? `<img src="${icon}" alt="${displayName}">`
                    : `<span>👤</span>`;
                
                displayElement.innerHTML = `
                    <div class="contact-avatar">
                        ${avatarContent}
                    </div>
                    <div class="recipient-details">
                        <strong>${displayName}</strong>
                        <small>${number}</small>
                    </div>
                `;
            } else {
                displayElement.innerHTML = `
                    <div class="contact-avatar"><span>❓</span></div>
                    <div class="recipient-details">No recipient configured yet.</div>
                `;
            }
        }

        function saveManualNumber() {
            const input = document.getElementById('phoneNumberInput');
            const newNumber = input.value.trim();

            if (newNumber) {
                localStorage.setItem('targetPhoneNumber', newNumber);
                localStorage.removeItem('targetContactName');
                localStorage.removeItem('targetContactIcon'); // Clear icon if manually set
                displayConfiguredNumber(newNumber);
                input.value = '';
                toggleManualEntry(false); // Collapse form after saving
                
                // Visual feedback
                const btn = document.getElementById('saveManualButton');
                const originalText = btn.innerText;
                btn.innerText = 'Saved!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '';
                }, 2000);
            }
        }

        async function selectContact() {
            if ('contacts' in navigator) {
                try {
                    // Try to get icon support
                    const supportedProps = await navigator.contacts.getProperties();
                    const props = ['tel', 'name'];
                    if (supportedProps.includes('icon')) {
                        props.push('icon');
                    }

                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);

                    if (contacts.length > 0) {
                        const contact = contacts[0];
                        const phoneNumber = contact.tel[0];
                        const contactName = contact.name[0] || "Unknown";
                        let contactIcon = null;

                        if (contact.icon && contact.icon.length > 0) {
                            try {
                                contactIcon = await blobToDataURL(contact.icon[0]);
                            } catch (e) {
                                console.error('Icon conversion error:', e);
                            }
                        }

                        localStorage.setItem('targetPhoneNumber', phoneNumber);
                        localStorage.setItem('targetContactName', contactName);
                        if (contactIcon) {
                            localStorage.setItem('targetContactIcon', contactIcon);
                        } else {
                            localStorage.removeItem('targetContactIcon');
                        }
                        displayConfiguredNumber(phoneNumber, contactName, contactIcon);
                    }
                } catch (error) {
                    console.error('Contact picker error:', error);
                }
            } else {
                alert('Contact selection is not supported on this browser. Try Chrome on Android!');
            }
        }

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function sendMessage(id) {
            const number = localStorage.getItem('targetPhoneNumber');
            if (!number) {
                alert('Please configure a recipient first!');
                return;
            }
            const btn = customButtons.find(b => b.id === id);
            if (!btn) return;
            
            const text = btn.message;
            window.location.href = `sms:${number}?body=${encodeURIComponent(text)}`;
        }

        function callRecipient() {
            const number = localStorage.getItem('targetPhoneNumber');
            if (!number) {
                alert('Please configure a recipient first!');
                return;
            }
            window.location.href = `tel:${number}`;
        }
    </script>
</body>
</html>
