<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickHello</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 24px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .settings-container {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .input-group.active {
            max-height: 300px;
            opacity: 1;
            margin-top: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            font-size: 0.875rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input[type="tel"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .contact-bar {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 4px 4px 16px 4px;
            margin-bottom: 24px;
            scrollbar-width: none; /* Hide scrollbar Firefox */
            -ms-overflow-style: none; /* Hide scrollbar IE/Edge */
        }

        .contact-bar::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s;
            position: relative;
        }

        .contact-item .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid transparent;
            padding: 2px;
            transition: all 0.3s;
            overflow: hidden;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-item.active .avatar {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            transform: scale(1.1);
        }

        .contact-item .name {
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .add-contact-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .add-contact-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        #currentNumberDisplay {
            margin-bottom: 16px;
            font-size: 0.875rem;
            color: var(--text-muted);
            padding: 12px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            display: none; /* Hidden unless needed for manual entry view */
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipient-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .recipient-details strong {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 8px;
        }

        .action-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .action-btn .icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .action-btn .label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Message highlights */
        #coffee:hover .icon { filter: drop-shadow(0 0 8px #d97706); }
        #wave:hover .icon { filter: drop-shadow(0 0 8px #3b82f6); }
        #heart:hover .icon { filter: drop-shadow(0 0 8px #ef4444); }
        #hungry:hover .icon { filter: drop-shadow(0 0 8px #f97316); }
        #dinner:hover .icon { filter: drop-shadow(0 0 8px #10b981); }
        #call:hover .icon { filter: drop-shadow(0 0 8px #34d399); }

        @media (max-width: 480px) {
            .glass-card {
                padding: 24px;
            }
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 2px solid var(--card-bg);
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .action-btn.active-delete .delete-btn {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .action-btn.active-delete {
            animation: wiggle 0.3s infinite;
        }

        @keyframes wiggle {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-1deg); }
            75% { transform: rotate(1deg); }
            100% { transform: rotate(0deg); }
        }

        .action-btn {
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .contact-delete-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 10;
        }

        .contact-item.active-delete .contact-delete-btn {
            display: flex;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-card">
        <h1>QuickHello</h1>

        <!-- Multi-Contact Bar -->
        <div class="contact-bar" id="contactBar">
            <!-- Dynamically populated -->
        </div>

        <div class="actions-grid" id="actionsGrid">
            <!-- Dynamically populated -->
        </div>

        <div class="settings-container">
            <div id="currentNumberDisplay">No recipient configured.</div>

            <div class="btn-group">
                <button id="toggleManualButton" class="btn btn-secondary">
                    <span>⌨️</span> +Contact
                </button>
                <button id="toggleAddButton" class="btn btn-secondary">
                    <span>➕</span> +Button
                </button>
            </div>

            <div class="input-group" id="manualEntryForm">
                <label for="phoneNumberInput">Add Contact Manually</label>
                <input type="text" id="manualNameInput" placeholder="Name" style="padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; margin-bottom: 8px;">
                <input type="tel" id="phoneNumberInput" placeholder="Phone Number" style="margin-bottom: 8px;">
                <div class="btn-group">
                    <button id="saveManualButton" class="btn btn-primary">Save</button>
                    <button id="cancelManualButton" class="btn btn-secondary">Cancel</button>
                </div>
            </div>

            <div class="input-group" id="addButtonForm">
                <!-- (Keep existing Add Button form) -->
                <label>Add New Button</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newButtonIcon" placeholder="Icon (e.g. 🏡)" style="flex: 1; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white;">
                    <input type="text" id="newButtonLabel" placeholder="Label (e.g. Home)" style="flex: 2; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white;">
                </div>
                <textarea id="newButtonMessage" placeholder="Message to send..." style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; min-height: 80px; font-family: inherit; resize: none; box-sizing: border-box;"></textarea>
                <div class="btn-group">
                    <button id="saveNewButton" class="btn btn-primary">Add Button</button>
                    <button id="cancelAddButton" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_BUTTONS = [
            { id: 'coffee', icon: '☕', label: 'Coffee', message: 'Coffee! Now! ☕' },
            { id: 'wave', icon: '👋', label: 'Wave', message: '👋' },
            { id: 'heart', icon: '❤️', label: 'Heart', message: '❤️' },
            { id: 'hungry', icon: '🍕', label: 'Hungry', message: 'I\'m hungry! 🍕' },
            { id: 'dinner', icon: '🍽️', label: 'Dinner', message: 'Dinner is ready! 🍽️' },
            { id: 'call', icon: '📞', label: 'Call', isCall: true }
        ];

        let customButtons = [];
        let quickContacts = [];
        let activeContactId = null;

        document.addEventListener('DOMContentLoaded', () => {
            migrateData();
            loadCustomButtons();
            loadContacts();
            renderContacts();
            renderButtons();
            
            document.getElementById('saveManualButton').addEventListener('click', saveManualContact);
            document.getElementById('toggleManualButton').addEventListener('click', () => toggleForm('manualEntryForm', true));
            document.getElementById('cancelManualButton').addEventListener('click', () => toggleForm('manualEntryForm', false));
            
            document.getElementById('toggleAddButton').addEventListener('click', () => toggleForm('addButtonForm', true));
            document.getElementById('cancelAddButton').addEventListener('click', () => toggleForm('addButtonForm', false));
            document.getElementById('saveNewButton').addEventListener('click', addNewButton);

            // Dismiss overlays
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.action-btn') && !e.target.closest('.contact-item')) {
                    hideDeleteIcons();
                }
            });
        });

        function migrateData() {
            const oldNumber = localStorage.getItem('targetPhoneNumber');
            if (oldNumber && !localStorage.getItem('quickContacts')) {
                const legacyContact = {
                    id: 'legacy_' + Date.now(),
                    name: localStorage.getItem('targetContactName') || 'Favorite',
                    number: oldNumber,
                    icon: localStorage.getItem('targetContactIcon')
                };
                quickContacts = [legacyContact];
                activeContactId = legacyContact.id;
                saveContacts();
                localStorage.removeItem('targetPhoneNumber');
                localStorage.removeItem('targetContactName');
                localStorage.removeItem('targetContactIcon');
            }
        }

        function loadContacts() {
            const saved = localStorage.getItem('quickContacts');
            if (saved) {
                quickContacts = JSON.parse(saved);
                activeContactId = localStorage.getItem('activeContactId') || (quickContacts.length > 0 ? quickContacts[0].id : null);
            }
        }

        function saveContacts() {
            localStorage.setItem('quickContacts', JSON.stringify(quickContacts));
            localStorage.setItem('activeContactId', activeContactId);
        }

        function renderContacts() {
            const bar = document.getElementById('contactBar');
            bar.innerHTML = '';
            
            quickContacts.forEach(contact => {
                const item = document.createElement('div');
                item.className = `contact-item ${contact.id === activeContactId ? 'active' : ''}`;
                item.onclick = () => switchContact(contact.id);
                
                const avatarContent = contact.icon 
                    ? `<img src="${contact.icon}" alt="${contact.name}">`
                    : `<span>👤</span>`;

                item.innerHTML = `
                    <div class="avatar">${avatarContent}</div>
                    <div class="name">${contact.name}</div>
                    <span class="contact-delete-btn" onclick="deleteContact(event, '${contact.id}')">×</span>
                `;

                // Long press for contact delete
                item.onmousedown = (e) => startContactPress(e);
                item.onmouseup = () => endContactPress();
                item.ontouchstart = (e) => startContactPress(e);
                item.ontouchend = () => endContactPress();

                bar.appendChild(item);
            });

            // Add (+) button for contact picker
            const addBtn = document.createElement('div');
            addBtn.className = 'add-contact-btn';
            addBtn.innerHTML = '➕';
            addBtn.onclick = selectContactFromPicker;
            bar.appendChild(addBtn);
        }

        function switchContact(id) {
            if (isLongPress) return;
            activeContactId = id;
            saveContacts();
            renderContacts();
        }

        let contactPressTimer;
        function startContactPress(e) {
            isLongPress = false;
            contactPressTimer = setTimeout(() => {
                isLongPress = true;
                const item = e.target.closest('.contact-item');
                if (item) item.classList.add('active-delete');
            }, 600);
        }
        function endContactPress() {
            clearTimeout(contactPressTimer);
        }

        function hideDeleteIcons() {
            document.querySelectorAll('.action-btn, .contact-item').forEach(b => b.classList.remove('active-delete'));
        }

        function toggleForm(id, show) {
            const forms = ['manualEntryForm', 'addButtonForm'];
            forms.forEach(fId => {
                const form = document.getElementById(fId);
                if (fId === id && show) {
                    form.classList.add('active');
                } else {
                    form.classList.remove('active');
                }
            });
        }

        function loadCustomButtons() {
            const saved = localStorage.getItem('customButtons');
            if (saved) {
                customButtons = JSON.parse(saved);
            } else {
                customButtons = [...DEFAULT_BUTTONS];
                saveCustomButtons();
            }
        }

        function saveCustomButtons() {
            localStorage.setItem('customButtons', JSON.stringify(customButtons));
        }

        let pressTimer;
        let isLongPress = false;

        function renderButtons() {
            const grid = document.getElementById('actionsGrid');
            grid.innerHTML = '';
            
            customButtons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'action-btn';
                button.id = btn.id;
                
                const isDefault = DEFAULT_BUTTONS.find(d => d.id === btn.id);

                button.innerHTML = `
                    <span class="icon">${btn.icon}</span>
                    <span class="label">${btn.label}</span>
                    ${!isDefault ? `<span class="delete-btn" onclick="deleteButton(event, '${btn.id}')">×</span>` : ''}
                `;
                
                // Event listeners for long press
                if (!isDefault) {
                    button.onmousedown = (e) => startPress(e);
                    button.onmouseup = (e) => endPress(e, btn);
                    button.ontouchstart = (e) => startPress(e);
                    button.ontouchend = (e) => endPress(e, btn);
                } else {
                    button.onclick = btn.isCall ? () => callRecipient() : () => sendMessage(btn.id);
                }
                
                grid.appendChild(button);
            });
        }

        function startPress(e) {
            isLongPress = false;
            pressTimer = setTimeout(() => {
                isLongPress = true;
                const btn = e.target.closest('.action-btn');
                if (btn) btn.classList.add('active-delete');
            }, 600);
        }

        function endPress(e, btnData) {
            clearTimeout(pressTimer);
            if (!isLongPress) {
                // Regular tap
                if (btnData.isCall) {
                    callRecipient();
                } else {
                    sendMessage(btnData.id);
                }
            }
        }

        function addNewButton() {
            const icon = document.getElementById('newButtonIcon').value.trim();
            const label = document.getElementById('newButtonLabel').value.trim();
            const message = document.getElementById('newButtonMessage').value.trim();

            if (!icon || !label || !message) {
                alert('Please fill in all fields (Icon, Label, and Message).');
                return;
            }

            const newBtn = {
                id: 'custom_' + Date.now(),
                icon: icon,
                label: label,
                message: message
            };

            customButtons.splice(customButtons.length - 1, 0, newBtn); // Add before "Call"
            saveCustomButtons();
            renderButtons();
            
            // Reset form
            document.getElementById('newButtonIcon').value = '';
            document.getElementById('newButtonLabel').value = '';
            document.getElementById('newButtonMessage').value = '';
            toggleForm('addButtonForm', false);
        }

        function deleteButton(event, id) {
            event.stopPropagation();
            if (confirm('Delete this button?')) {
                customButtons = customButtons.filter(b => b.id !== id);
                saveCustomButtons();
                renderButtons();
            }
        }

        function loadConfiguredNumber() {
            const savedNumber = localStorage.getItem('targetPhoneNumber');
            const savedName = localStorage.getItem('targetContactName');
            const savedIcon = localStorage.getItem('targetContactIcon');
            displayConfiguredNumber(savedNumber, savedName, savedIcon);
        }

        function displayConfiguredNumber(number, name, icon) {
            const displayElement = document.getElementById('currentNumberDisplay');
            if (number) {
                const displayName = name || 'User';
                const avatarContent = icon 
                    ? `<img src="${icon}" alt="${displayName}">`
                    : `<span>👤</span>`;
                
                displayElement.innerHTML = `
                    <div class="contact-avatar">
                        ${avatarContent}
                    </div>
                    <div class="recipient-details">
                        <strong>${displayName}</strong>
                        <small>${number}</small>
                    </div>
                `;
            } else {
                displayElement.innerHTML = `
                    <div class="contact-avatar"><span>❓</span></div>
                    <div class="recipient-details">No recipient configured yet.</div>
                `;
            }
        }

        function saveManualContact() {
            const nameInput = document.getElementById('manualNameInput');
            const numInput = document.getElementById('phoneNumberInput');
            const newNumber = numInput.value.trim();
            const newName = nameInput.value.trim() || 'User';

            if (newNumber) {
                const newContact = {
                    id: 'manual_' + Date.now(),
                    name: newName,
                    number: newNumber,
                    icon: null
                };
                
                quickContacts.push(newContact);
                activeContactId = newContact.id;
                saveContacts();
                renderContacts();

                nameInput.value = '';
                numInput.value = '';
                toggleForm('manualEntryForm', false);
            }
        }

        async function selectContactFromPicker() {
            if ('contacts' in navigator) {
                try {
                    const supportedProps = await navigator.contacts.getProperties();
                    const props = ['tel', 'name'];
                    if (supportedProps.includes('icon')) props.push('icon');

                    const contacts = await navigator.contacts.select(props, { multiple: false });

                    if (contacts.length > 0) {
                        const contact = contacts[0];
                        const icon = (contact.icon && contact.icon.length > 0) ? await blobToDataURL(contact.icon[0]) : null;
                        
                        const newContact = {
                            id: 'picker_' + Date.now(),
                            name: contact.name[0] || "Unknown",
                            number: contact.tel[0],
                            icon: icon
                        };

                        quickContacts.push(newContact);
                        activeContactId = newContact.id;
                        saveContacts();
                        renderContacts();
                    }
                } catch (error) {
                    console.error('Picker error:', error);
                }
            } else {
                toggleForm('manualEntryForm', true);
            }
        }

        function deleteContact(event, id) {
            event.stopPropagation();
            if (confirm('Remove this contact from QuickHello?')) {
                quickContacts = quickContacts.filter(c => c.id !== id);
                if (activeContactId === id) {
                    activeContactId = quickContacts.length > 0 ? quickContacts[0].id : null;
                }
                saveContacts();
                renderContacts();
            }
        }

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function sendMessage(id) {
            if (!activeContactId) {
                alert('Pick a contact at the top first!');
                return;
            }
            const contact = quickContacts.find(c => c.id === activeContactId);
            const btn = customButtons.find(b => b.id === id);
            if (!contact || !btn) return;
            
            window.location.href = `sms:${contact.number}?body=${encodeURIComponent(btn.message)}`;
        }

        function callRecipient() {
            if (!activeContactId) {
                alert('Pick a contact at the top first!');
                return;
            }
            const contact = quickContacts.find(c => c.id === activeContactId);
            if (!contact) return;
            window.location.href = `tel:${contact.number}`;
        }
    </script>
</body>
</html>
